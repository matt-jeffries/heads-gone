name: Build club packs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-club-packs.mjs, scripts/club-wiki.json]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-club-packs.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club-packs.js scripts/club-packs-log.txt
          git diff --cached --quiet || git commit -m "Update club packs from Wikidata"
          git pull --rebase origin main && git push
